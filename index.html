<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>well well</title>
  <meta name="description" content="Tu proceso médico, paso a paso y sin palabras raras: ruta, medicinas, citas, expediente y avisos." />
  <meta name="theme-color" content="#E0FAFF" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bungee&family=DM+Serif+Display:ital@1&family=Rubik+Mono+One&family=Shrikhand&family=Space+Mono:wght@700&family=Young+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ================= BARRA SUPERIOR (portada, Lupi, ingresar) ================= -->
  <header class="topbar" id="topbar">
    <a href="#/asistente" class="lupi-pill" data-nav="asistente"><span class="nav-lupi" aria-hidden="true"></span>Lupi</a>
    <a href="#/ingresar" class="top-link" id="navIngresar" data-nav="ingresar">Ingresar</a>
  </header>

  <main id="main">

    <!-- ================= PORTADA ================= -->
    <section class="view screen" data-view="home">
      <div class="home-head">
        <h1 class="home-logo"><span data-cut="well well" data-size="38" data-seed="0"></span></h1>
        <p class="home-tag">¡hola! paso a paso,<br>sin palabras raras</p>
      </div>
      <a href="#/ingresar" class="btn btn-primary btn-xl">Ingresar con mi ID →</a>

      <div class="band" id="avisosBand" aria-label="Avisos del hospital" hidden>
        <div class="band-track" id="marqueeTrack"></div>
      </div>

      <section class="block">
        <h2 class="h-sub">Rumbo al alta</h2>
        <div class="rumbo" id="rumbo"></div>
        <p class="rumbo-txt" id="rumboTxt" aria-live="polite"></p>
      </section>

      <section class="block">
        <h2 class="h-sub">¿Quién eres?</h2>
        <div class="quien" id="quien"></div>
      </section>

      <p class="note-dashed">Ante una emergencia, avisa de inmediato a tu enfermera o médico.</p>
    </section>

    <!-- ================= LUPI ================= -->
    <section class="view screen" data-view="asistente" hidden>
      <a href="#/" class="btn-back" id="lupiBack">← Volver</a>
      <h1 class="screen-title"><span data-cut="Pregúntale a Lupi" data-size="30" data-seed="3"></span></h1>

      <div class="lupi-stage">
        <div class="lupi-big" id="lupiBig" data-state="idle"></div>
        <div class="bubble" id="lupiBubble" aria-live="polite">
          <p class="bubble-term" id="bubbleTerm"></p>
          <div class="bubble-text" id="bubbleText"></div>
        </div>
      </div>

      <div class="seg" role="radiogroup" aria-label="¿Cómo te lo explico?">
        <button type="button" class="seg-btn mode-btn active" data-mode="nino" role="radio" aria-checked="true">Para peques</button>
        <button type="button" class="seg-btn mode-btn" data-mode="adulto" role="radio" aria-checked="false">Para grandes</button>
      </div>

      <form id="lupiForm" class="lupi-form" autocomplete="off">
        <label for="lupiInput" class="sr-only">Escribe una palabra o pregunta</label>
        <input id="lupiInput" maxlength="300" placeholder="¿Qué palabra no entiendes?" />
        <button type="submit" class="btn btn-primary" id="lupiSend">Explícame</button>
      </form>

      <div class="chips" id="lupiChips"></div>

      <div class="row-between">
        <h2 class="h-sub">Mis tarjetas</h2>
        <button type="button" class="btn-soft btn-sm" id="clearCards" hidden>Borrar</button>
      </div>
      <div class="cards-grid" id="lupiCards"></div>
    </section>

    <!-- ================= INGRESAR ================= -->
    <section class="view screen" data-view="ingresar" hidden>
      <a href="#/" class="btn-back">← Volver</a>
      <h1 class="screen-title"><span data-cut="Ingresa" data-size="38" data-seed="5"></span></h1>

      <div class="seg seg-big" role="tablist">
        <button type="button" class="seg-btn role-card active" data-role="paciente" role="tab" aria-selected="true">Paciente o familiar</button>
        <button type="button" class="seg-btn role-card" data-role="personal" role="tab" aria-selected="false">Personal de apoyo</button>
      </div>

      <form id="loginForm" class="card login-form" novalidate>
        <label for="loginId" id="loginIdLabel">ID de paciente</label>
        <input id="loginId" class="mono" autocomplete="username" placeholder="WW-0000-00" maxlength="20" />
        <label for="loginCode">Código de acceso</label>
        <input id="loginCode" type="password" autocomplete="current-password" placeholder="••••••" maxlength="40" />
        <p class="form-error" id="loginError" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-xl" id="loginBtn">Entrar →</button>
        <p class="hint" id="loginHint"></p>
      </form>
    </section>

    <!-- ================= APP DEL PACIENTE ================= -->
    <section class="view screen app-screen" data-view="app" hidden>
      <div id="appBody"></div>
    </section>

    <!-- ================= PANEL DE RECEPCIÓN ================= -->
    <section class="view screen app-screen" data-view="personal" hidden>
      <div id="staffBody"></div>
    </section>
  </main>

  <!-- Barra inferior del paciente -->
  <nav class="bottom-nav" id="bottomNav" hidden aria-label="Secciones">
    <a href="#/app/inicio" data-tab="inicio">Inicio</a>
    <a href="#/app/ruta" data-tab="ruta">Mi ruta</a>
    <a href="#/app/expediente" data-tab="expediente">Expediente</a>
    <a href="#/asistente" data-tab="asistente"><span class="nav-lupi sm" aria-hidden="true"></span>Lupi</a>
  </nav>

  <!-- Hoja inferior (urgente, aviso, documento) -->
  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" id="sheetPanel"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/cutout.js"></script>
  <script src="js/lupi-art.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/lupi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
